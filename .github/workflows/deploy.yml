# CI/CD: every push to main is tested, built into a Docker image and deployed to the DigitalOcean server.
# A failed test stops everything: the server keeps running the last good version.
#
# GitHub > Settings > Secrets and variables > Actions > New repository secret:
#   SSH_HOST  the server's static IP
#   SSH_USER  deploy
#   SSH_KEY   the private SSH key that can log in to the server (whole file, including BEGIN/END lines)
name: test-build-deploy

on:
  push:
    # Only main deploys. Other branches are not built or deployed.
    branches: [main]
  workflow_dispatch: {}   # "Run workflow" button in the Actions tab

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/jain_sthanak

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
      - name: Copy server files
        run: |
          scp -i ~/.ssh/id_deploy -r docker-compose.yml Caddyfile docker scripts "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/jainsangh/"
      - name: Pull the new image and restart
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" bash -s <<SCRIPT
          set -e
          cd /opt/jainsangh
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          export APP_IMAGE=${{ env.IMAGE }}:${{ github.sha }}
          docker compose pull app
          docker compose up -d --build --remove-orphans
          docker logout ghcr.io
          echo "\$APP_IMAGE \$(date -Is)" >> deploys.log
          docker image prune -f
          SCRIPT
      - name: Check the site answers
        run: |
          sleep 20
          ssh -i ~/.ssh/id_deploy "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "cd /opt/jainsangh && docker compose ps && curl -fsS -o /dev/null -w '%{http_code}\n' http://localhost:80 -H 'Host: '\$(grep ^APP_DOMAIN .env | cut -d= -f2 | tr -d '\"') || true"
