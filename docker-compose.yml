# Everything that runs on the server. Start/update with:  docker compose up -d
# Values like ${POSTGRES_PASSWORD} come from the .env file next to this file.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jainsangh
      POSTGRES_DB: jainsangh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data   # the database files live here and survive updates
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jainsangh -d jainsangh"]
      interval: 10s
      timeout: 5s
      retries: 10
    # no "ports:" on purpose: the database cannot be reached from the internet

  app:
    image: ${APP_IMAGE:-ghcr.io/pratikluniya/jain_sthanak:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://jainsangh:${POSTGRES_PASSWORD}@db:5432/jainsangh?connection_limit=5
    volumes:
      - ./data/uploads:/data/uploads   # form photos + KYC scans live on the server disk (folder /opt/jainsangh/data/uploads)
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 900m

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # HTTPS certificates
      - caddy_config:/config
    depends_on:
      - app

  backup:
    build: ./docker/backup
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: jainsangh
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: jainsangh
      KEEP_DAYS: "14"
    volumes:
      - ./data/backups:/backups        # nightly database copies (folder /opt/jainsangh/data/backups)
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
